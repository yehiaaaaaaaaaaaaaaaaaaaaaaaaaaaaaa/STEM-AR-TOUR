<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM Racing AR Technical Presentation</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    color-space="sRGB"
    renderer="
        colorManagement: true,
        physicallyCorrectLights
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
        <a-asset-item
            id="carModel"
            src="AR1.glb">
        </a-asset-item>
    </a-assets>

    <a-camera
        position="0 0 0"
        look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

        <a-entity id="carRotation">

            <a-gltf-model
                id="carModelAR"
                src="#carModel"
                position="0 -1.5 0"
                rotation="0 -90 0"
                scale="15 15 15">
            </a-gltf-model>

        </a-entity>

    </a-entity>

</a-scene>

<script>

const carRotation =
    document.querySelector("#carRotation");

const target =
    document.querySelector("[mindar-image-target]");

let tourStarted = false;


target.addEventListener("targetFound", () => {

    if (tourStarted) {
        return;
    }

    tourStarted = true;

    startTour();

});


function rotateTo(x, y, z, duration) {

    return new Promise(resolve => {

        const start =
            carRotation.getAttribute("rotation");

        const startX = start.x;
        const startY = start.y;
        const startZ = start.z;

        const startTime =
            performance.now();


        function animate(time) {

            const progress =
                Math.min(
                    (time - startTime) / duration,
                    1
                );


            const eased =
                progress < 0.5
                    ? 2 * progress * progress
                    : 1 -
                      Math.pow(
                          -2 * progress + 2,
                          2
                      ) / 2;


            const currentX =
                startX +
                (x - startX) * eased;

            const currentY =
                startY +
                (y - startY) * eased;

            const currentZ =
                startZ +
                (z - startZ) * eased;


            carRotation.setAttribute(
                "rotation",
                {
                    x: currentX,
                    y: currentY,
                    z: currentZ
                }
            );


            if (progress < 1) {

                requestAnimationFrame(animate);

            } else {

                resolve();

            }

        }


        requestAnimationFrame(animate);

    });

}


function wait(milliseconds) {

    return new Promise(resolve => {

        setTimeout(
            resolve,
            milliseconds
        );

    });

}


async function startTour() {

    /* =========================
       TOP
       ========================= */

    carRotation.setAttribute(
        "rotation",
        {
            x: 0,
            y: 0,
            z: 0
        }
    );

    await wait(3000);


    /* =========================
       BOTTOM
       ========================= */

    await rotateTo(
        0,
        180,
        0,
        2500
    );

    await wait(3500);


    /* =========================
       FRONT
       ========================= */

    await rotateTo(
        -90,
        180,
        0,
        2500
    );

    await wait(3500);


    /* =========================
       SIDE
       ========================= */

    await rotateTo(
        -90,
        90,
        0,
        2500
    );

    await wait(3500);


    /* =========================
       BACK
       Same 90° movement
       as FRONT → SIDE
       ========================= */

    await rotateTo(
        -90,
        0,
        0,
        2500
    );

    await wait(3500);


    /* =========================
       RETURN TO TOP
       ========================= */

    await rotateTo(
        0,
        0,
        0,
        2500
    );

    await wait(2000);

}

</script>

</body>
</html>
