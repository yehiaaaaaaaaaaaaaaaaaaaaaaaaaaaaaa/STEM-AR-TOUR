<a-assets>

<a-camera

<script>


/* =========================================================
   ELEMENTS
   ========================================================= */

const carRotation =
    document.querySelector("#carRotation");

const target =
    document.querySelector("[mindar-image-target]");


const topBox =
    document.querySelector("#topBox");

const bottomBox =
    document.querySelector("#bottomBox");

const frontBox =
    document.querySelector("#frontBox");

const sideBox =
    document.querySelector("#sideBox");

const backBox =
    document.querySelector("#backBox");


let tourStarted = false;


/* =========================================================
   FADE EFFECT
   ========================================================= */

function fadeIn(box, duration = 700) {

    box.setAttribute(
        "visible",
        true
    );

    box.setAttribute(
        "animation__fadein",
        {
            property: "material.opacity",
            from: 0,
            to: 1,
            dur: duration,
            easing: "easeInOutQuad"
        }
    );

    /*
     * Fade the individual objects inside the panel.
     */
    const children =
        box.querySelectorAll(
            "a-plane, a-text"
        );

    children.forEach(child => {

        child.setAttribute(
            "material",
            "transparent: true; opacity: 0"
        );

        child.setAttribute(
            "animation__fadein",
            {
                property: "material.opacity",
                from: 0,
                to: 1,
                dur: duration,
                easing: "easeInOutQuad"
            }
        );

    });

}


function fadeOut(box, duration = 600) {

    return new Promise(resolve => {

        const children =
            box.querySelectorAll(
                "a-plane, a-text"
            );

        let finished = 0;

        if (children.length === 0) {
            box.setAttribute(
                "visible",
                false
            );
            resolve();
            return;
        }

        children.forEach(child => {

            child.setAttribute(
                "material",
                "transparent: true"
            );

            child.setAttribute(
                "animation__fadeout",
                {
                    property: "material.opacity",
                    from: 1,
                    to: 0,
                    dur: duration,
                    easing: "easeInOutQuad"
                }
            );

            child.addEventListener(
                "animationcomplete__fadeout",
                () => {

                    finished++;

                    if (finished === children.length) {

                        box.setAttribute(
                            "visible",
                            false
                        );

                        resolve();

                    }

                },
                {
                    once: true
                }
            );

        });

    });

}


/* =========================================================
   HIDE ALL BOXES
   ========================================================= */

async function hideAllBoxes() {

    const boxes = [
        topBox,
        bottomBox,
        frontBox,
        sideBox,
        backBox
    ];

    for (const box of boxes) {

        if (
            box.getAttribute("visible") === true
        ) {

            await fadeOut(
                box,
                500
            );

        } else {

            box.setAttribute(
                "visible",
                false
            );

        }

    }

}


/* =========================================================
   SHOW ONE BOX
   ========================================================= */

async function showBox(box) {

    await hideAllBoxes();

    fadeIn(
        box,
        700
    );

}


/* =========================================================
   TARGET FOUND
   ========================================================= */

target.addEventListener(
    "targetFound",
    () => {

        if (tourStarted) {
            return;
        }

        tourStarted = true;

        startTour();

    }
);


/* =========================================================
   ROTATION
   ========================================================= */

function rotateTo(
    x,
    y,
    z,
    duration
) {

    return new Promise(resolve => {

        const start =
            carRotation.getAttribute(
                "rotation"
            );


        const startX =
            start.x;

        const startY =
            start.y;

        const startZ =
            start.z;


        const startTime =
            performance.now();


        function animate(time) {

            const progress =
                Math.min(
                    (time - startTime) /
                    duration,
                    1
                );


            const eased =
                progress < 0.5
                    ? 2 *
                      progress *
                      progress

                    : 1 -
                      Math.pow(
                          -2 *
                          progress +
                          2,
                          2
                      ) /
                      2;


            const currentX =
                startX +
                (x - startX) *
                eased;


            const currentY =
                startY +
                (y - startY) *
                eased;


            const currentZ =
                startZ +
                (z - startZ) *
                eased;


            carRotation.setAttribute(
                "rotation",
                {
                    x: currentX,
                    y: currentY,
                    z: currentZ
                }
            );


            if (progress < 1) {

                requestAnimationFrame(
                    animate
                );

            } else {

                resolve();

            }

        }


        requestAnimationFrame(
            animate
        );

    });

}


/* =========================================================
   WAIT
   ========================================================= */

function wait(
    milliseconds
) {

    return new Promise(
        resolve => {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );

}


/* =========================================================
   MAIN TOUR
   ========================================================= */

async function startTour() {


    /* =====================================================
       TOP
       ===================================================== */

    carRotation.setAttribute(
        "rotation",
        {
            x: 0,
            y: 0,
            z: 0
        }
    );

    fadeIn(
        topBox,
        700
    );

    await wait(4000);


    /* =====================================================
       BOTTOM
       ===================================================== */

    await fadeOut(
        topBox,
        600
    );

    await rotateTo(
        0,
        180,
        0,
        2500
    );

    fadeIn(
        bottomBox,
        700
    );

    await wait(4500);


    /* =====================================================
       FRONT
       ===================================================== */

    await fadeOut(
        bottomBox,
        600
    );

    await rotateTo(
        -90,
        180,
        0,
        2500
    );

    fadeIn(
        frontBox,
        700
    );

    await wait(5000);


    /* =====================================================
       SIDE
       ===================================================== */

    await fadeOut(
        frontBox,
        600
    );

    await rotateTo(
        -90,
        90,
        0,
        2500
    );

    fadeIn(
        sideBox,
        700
    );

    await wait(4500);


    /* =====================================================
       BACK
       ===================================================== */

    await fadeOut(
        sideBox,
        600
    );

    await rotateTo(
        -90,
        0,
        0,
        2500
    );

    fadeIn(
        backBox,
        700
    );

    await wait(4500);


    /* =====================================================
       RETURN TO TOP
       ===================================================== */

    await fadeOut(
        backBox,
        600
    );

    await rotateTo(
        0,
        0,
        0,
        2500
    );

    await wait(500);

    fadeIn(
        topBox,
        700
    );

}

</script>
