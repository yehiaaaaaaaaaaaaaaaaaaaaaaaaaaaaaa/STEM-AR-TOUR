<script>

const carRotation = document.querySelector("#carRotation");
const target = document.querySelector("[mindar-image-target]");

let tourStarted = false;


/* Start when the card is detected */
target.addEventListener("targetFound", () => {

    if (tourStarted) return;

    tourStarted = true;

    startTour();

});


/* Smooth rotation */
function rotateTo(x, y, z, duration) {

    return new Promise(resolve => {

        const start = carRotation.getAttribute("rotation");

        const startX = start.x;
        const startY = start.y;
        const startZ = start.z;

        const startTime = performance.now();

        function animate(time) {

            const progress =
                Math.min((time - startTime) / duration, 1);

            const eased =
                progress < 0.5
                    ? 2 * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 2) / 2;

            carRotation.setAttribute("rotation", {
                x: startX + (x - startX) * eased,
                y: startY + (y - startY) * eased,
                z: startZ + (z - startZ) * eased
            });

            if (progress < 1) {

                requestAnimationFrame(animate);

            } else {

                resolve();

            }
        }

        requestAnimationFrame(animate);

    });

}


/* Smooth floating movement */
function moveTo(x, y, z, duration) {

    return new Promise(resolve => {

        const start = carRotation.getAttribute("position");

        const startX = start.x;
        const startY = start.y;
        const startZ = start.z;

        const startTime = performance.now();

        function animate(time) {

            const progress =
                Math.min((time - startTime) / duration, 1);

            const eased =
                progress < 0.5
                    ? 2 * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 2) / 2;

            carRotation.setAttribute("position", {
                x: startX + (x - startX) * eased,
                y: startY + (y - startY) * eased,
                z: startZ + (z - startZ) * eased
            });

            if (progress < 1) {

                requestAnimationFrame(animate);

            } else {

                resolve();

            }
        }

        requestAnimationFrame(animate);

    });

}


function wait(milliseconds) {

    return new Promise(resolve => {
        setTimeout(resolve, milliseconds);
    });

}


/* ================================
   THREE-MOVEMENT PRESENTATION
   ================================ */

async function startTour() {

    /*
        STARTING VIEW

        The viewer sees the BACK of the car.

        We keep the car exactly where it
        currently works.
    */

    carRotation.setAttribute("rotation", {
        x: 0,
        y: 0,
        z: 0
    });

    carRotation.setAttribute("position", {
        x: 0,
        y: 0,
        z: 0
    });


    /* Let the viewer see the starting view */
    await wait(2500);


    /*
        FLOAT UP

        The car gently lifts away from
        the card before the technical movement.
    */

    await moveTo(0, 0.35, 0, 1200);

    await wait(1000);


    /*
        MOVEMENT 1
        =========================

        UNDERBODY / UPSIDE-DOWN VIEW

        The car rotates backward so
        the underside becomes visible.
    */

    await rotateTo(180, 0, 0, 2500);

    await wait(3500);


    /*
        MOVEMENT 2
        =========================

        SIDE VIEW

        Rotate the car onto its side.
    */

    await rotateTo(180, -90, 0, 2500);

    await wait(3500);


    /*
        MOVEMENT 3
        =========================

        RETURN TO ORIGINAL VIEW
    */

    await rotateTo(0, 0, 0, 2500);

    await moveTo(0, 0, 0, 1200);

    await wait(3000);

}

</script>
